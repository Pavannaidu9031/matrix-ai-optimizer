<form action="/add" method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-900 p-6 rounded-2xl border border-slate-800 text-white">
  
  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">RF Power (W)</label>
    <input type="number" step="0.1" name="rf_power_w" required placeholder="e.g. 150" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Pressure (mTorr)</label>
    <input type="number" step="0.1" name="working_pressure_mtorr" required placeholder="e.g. 5" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Ar Flow (sccm)</label>
    <input type="number" step="0.1" name="ar_flow_sccm" required placeholder="e.g. 30" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">O2 Flow (sccm)</label>
    <input type="number" step="0.1" name="o2_flow_sccm" required placeholder="e.g. 5" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Substrate Temp (°C)</label>
    <input type="number" step="0.1" name="substrate_temp_c" required placeholder="e.g. 300" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <!-- UPDATED UNIT TO CM -->
  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Target Distance (cm)</label>
    <input type="number" step="0.1" name="target_substrate_distance_cm" required placeholder="e.g. 7" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Sputter Time (min)</label>
    <input type="number" step="0.1" name="sputtering_time_min" required placeholder="e.g. 30" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Film Thickness (nm)</label>
    <input type="number" step="0.1" name="film_thickness_nm" placeholder="e.g. 100" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <!-- NEW FIELD: Rotation Speed -->
  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Rotation Speed (rpm)</label>
    <select name="rotation_speed_rpm" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
      <option value="1">1 rpm</option>
      <option value="5" selected>5 rpm</option>
      <option value="10">10 rpm</option>
    </select>
  </div>

  <!-- NEW FIELD: Substrate Type -->
  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Substrate Type</label>
    <select name="substrate_type" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
      <option value="Si Wafer">Si Wafer</option>
      <option value="Optical Fiber">Optical Fiber</option>
    </select>
  </div>

  <!-- NEW FIELD: XRD Phase -->
  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">XRD Phase</label>
    <select name="xrd_phase" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
      <option value="Monoclinic">Monoclinic</option>
      <option value="Partial">Partial</option>
      <option value="Amorphous" selected>Amorphous</option>
    </select>
  </div>

  <!-- NEW FIELD: Grain Size -->
  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Grain Size (nm) <span class="text-slate-500">(FESEM)</span></label>
    <input type="number" step="0.1" name="grain_size_nm" placeholder="e.g. 25.4" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">H2 Response (s)</label>
    <input type="number" step="0.1" name="h2_response_time_s" required placeholder="e.g. 12" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <!-- NEW FIELD: Wavelength Shift -->
  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Wavelength Shift (pm) <span class="text-slate-500">(FBG)</span></label>
    <input type="number" step="0.1" name="wavelength_shift_pm" placeholder="e.g. 150" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">Batch / Notes</label>
    <input type="text" name="notes" placeholder="e.g. BATCH-2026-A" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
  </div>

  <div class="md:col-span-3 flex gap-4 mt-2">
    <button type="submit" class="bg-blue-600 hover:bg-blue-500 font-bold py-2.5 px-6 rounded-xl text-white transition">Save Experiment</button>
  </div>
</form>
