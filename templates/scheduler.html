<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Scheduler - MatrixAI</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    
    <!-- UNIFIED NAVIGATION BAR -->
    <nav class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center font-extrabold text-white text-lg shadow-lg">M</div>
                <span class="font-bold text-lg tracking-tight text-white">MatrixAI</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/" class="text-xs font-semibold text-slate-300 hover:text-blue-400 transition">Dashboard</a>
                <a href="/scheduler" class="text-xs font-semibold text-blue-400 transition">Scheduler</a>
                <a href="/thesis" class="text-xs font-semibold text-slate-300 hover:text-blue-400 transition">Thesis</a>
                <a href="/publication" class="text-xs font-semibold text-slate-300 hover:text-blue-400 transition">Publication</a>
                <div class="flex items-center space-x-3 bg-slate-850 px-3 py-1.5 rounded-xl border border-slate-800 ml-2">
                    {% if user.picture %}<img src="{{ user.picture }}" alt="Profile" class="w-6 h-6 rounded-full">{% endif %}
                    <span class="text-xs font-medium text-slate-300">{{ user.name }}</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="max-w-3xl mx-auto space-y-6 bg-slate-900 p-8 rounded-2xl border border-slate-800 mt-10 shadow-xl">
        <h1 class="text-2xl font-bold">Equipment Access Scheduler</h1>
        <p class="text-slate-400 text-sm mb-4">Input your lab availability to automatically schedule Bayesian convergence runs into 5.5-hour optimal blocks.</p>
        <div class="flex space-x-4">
            <input type="number" id="hrs" placeholder="Hours available" class="bg-slate-800 p-3 rounded-lg text-white w-full border border-slate-700 focus:border-blue-500 outline-none">
            <input type="number" id="days" placeholder="Days available" class="bg-slate-800 p-3 rounded-lg text-white w-full border border-slate-700 focus:border-blue-500 outline-none">
            <button onclick="plan()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-bold transition shadow-lg w-full md:w-auto whitespace-nowrap">Plan Week</button>
        </div>
        <div id="scheduleGrid" class="space-y-4 mt-6"></div>
    </div>
    
    <script>
        async function plan() {
            const hrs = document.getElementById('hrs').value;
            const days = document.getElementById('days').value;
            const res = await fetch('/api/scheduler/plan', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({hours: hrs, days: days})
            });
            const data = await res.json();
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = data.schedule.map(s => `<div class="bg-slate-800 p-4 rounded-lg border-l-4 border-blue-500"><h3 class="font-bold text-blue-400">${s.day}</h3><p class="text-sm mt-1">${s.task}</p><span class="text-xs text-slate-400 mt-2 block">Estimated Time: ${s.estimated_time}</span></div>`).join('');
        }
    </script>
</body>
</html>
