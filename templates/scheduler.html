<!DOCTYPE html>
<html lang="en" class="dark">
<head><script src="https://cdn.tailwindcss.com"></script><title>Scheduler - MatrixAI</title></head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8">
    <div class="max-w-3xl mx-auto space-y-6 bg-slate-900 p-8 rounded-2xl border border-slate-800">
        <h1 class="text-2xl font-bold">Equipment Access Scheduler</h1>
        <div class="flex space-x-4">
            <input type="number" id="hrs" placeholder="Hours available" class="bg-slate-800 p-3 rounded-lg text-white">
            <input type="number" id="days" placeholder="Days available" class="bg-slate-800 p-3 rounded-lg text-white">
            <button onclick="plan()" class="bg-blue-600 px-6 py-3 rounded-lg font-bold">Plan Week</button>
        </div>
        <div id="scheduleGrid" class="space-y-4 mt-6"></div>
    </div>
    <script>
        async function plan() {
            const hrs = document.getElementById('hrs').value;
            const days = document.getElementById('days').value;
            const res = await fetch('/api/scheduler/plan', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({hours: hrs, days: days})
            });
            const data = await res.json();
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = data.schedule.map(s => `<div class="bg-slate-800 p-4 rounded-lg border-l-4 border-blue-500"><h3 class="font-bold text-blue-400">${s.day}</h3><p>${s.task}</p><span class="text-xs text-slate-400">${s.estimated_time}</span></div>`).join('');
        }
    </script>
</body>
</html>
